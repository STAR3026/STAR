<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 Not Found</title>

<style>
html,body{
    margin:0;
    padding:0;
    background:#fff;
    color:#000;
    font-family:Tahoma,Verdana,Arial,sans-serif;
    font-size:16px;
}

.wrapper{
    max-width:760px;
    margin:40px auto;
    padding:0 20px;
}

h1{
    font-size:32px;
    font-weight:bold;
    margin:0 0 20px;
}

hr{
    border:none;
    border-top:1px solid #bfbfbf;
    margin:20px 0;
}

p{
    margin:14px 0;
    line-height:1.5;
}

.footer{
    font-size:14px;
    color:#333;
}

#secret{
    color:inherit;
    text-decoration:none;
    cursor:default;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

.spacer{
    height:220vh;
}
</style>
</head>

<body>

<div class="wrapper">

<h1>Not Found</h1>

<p>
The requested URL was not found on this server.
</p>

<hr>

<p class="footer">
Apache/<span id="secret">2</span>.4.58 (Unix) Server at localhost Port 443
</p>

</div>

<div class="spacer"></div>

<script>

const secret = document.getElementById("secret");

let timer = null;


/* 日本時間（JST）で現在時刻を取得 */
function getJapanTime(){

    const now = new Date();

    return new Date(
        now.toLocaleString("en-US", {
            timeZone: "Asia/Tokyo"
        })
    );
}


/*
 * 日本時間
 * 07:00〜23:44 → 入室可能
 * 23:45〜06:59 → 完全に無反応
 */
function isOpenTime(){

    const japanTime = getJapanTime();

    const hour = japanTime.getHours();
    const minute = japanTime.getMinutes();

    const currentMinutes = hour * 60 + minute;

    const openTime = 7 * 60;        // 07:00
    const closeTime = 23 * 60 + 45; // 23:45

    return currentMinutes >= openTime &&
           currentMinutes < closeTime;
}


function startPress(){

    /*
     * 23:45〜06:59は何もしない
     */
    if(!isOpenTime()){
        return;
    }

    timer = setTimeout(function(){

        /*
         * 長押し中に23:45を過ぎた場合も再確認
         */
        if(isOpenTime()){

            window.location.href =
            "https://oneday-chat.com/room/?id=l4jeppkdkwciyxmslait73xtulf11adx&cCW6cWYV1sRAQ0ZIbG3vT1AzmyX2";

        }

    },2000);

}


function cancelPress(){

    clearTimeout(timer);

}


secret.addEventListener("touchstart",startPress);
secret.addEventListener("touchend",cancelPress);
secret.addEventListener("touchcancel",cancelPress);

secret.addEventListener("mousedown",startPress);
secret.addEventListener("mouseup",cancelPress);
secret.addEventListener("mouseleave",cancelPress);

</script>

</body>
</html>
